<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DBrowser</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" defer></script>
<style>
:root{color-scheme:dark;--bg:#05070f;--ink:#eef0fb;--mute:#8890b3;--line:rgba(255,255,255,.1);--accent:#8fa2ff;--ease:cubic-bezier(.22,.85,.3,1);--dock-h:74px;--menubar-h:28px;--dock-size:52px}
*,*::before,*::after{box-sizing:border-box}
html{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="6" fill="%230b1340" stroke="%238fa2ff" stroke-width="2.2"/><circle cx="13" cy="13" r="1.6" fill="%238fa2ff"/></svg>') 13 13,auto}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg) no-repeat center/cover;color:var(--ink);font:400 14px/1.4 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="7" fill="%230b1340" stroke="%238fa2ff" stroke-width="2.4"/><path d="M9 13l3 3 5-6" stroke="%238fa2ff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') 13 13,pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sky{position:fixed;inset:0;z-index:0}

/* menu bar */
.menubar{position:fixed;top:0;left:0;right:0;height:var(--menubar-h);z-index:410;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(10,12,24,.6);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);font-size:12.5px;animation:mbIn .5s var(--ease) both;transition:transform .16s cubic-bezier(.4,0,1,1),opacity .16s}
.menubar.hide{transform:translateX(120%);opacity:0;pointer-events:none}
@keyframes mbIn{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
.mbrand{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;font-weight:600;transition:background .2s}
.mbrand:hover,.mbrand.on{background:rgba(255,255,255,.12)}
.mbrand .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#8fa2ff,#7df9ff)}
.mbright{display:flex;align-items:center;gap:14px;color:var(--mute)}
.mbright button{color:var(--mute);padding:3px 7px;border-radius:6px;transition:background .2s,color .2s}
.mbright button:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.mbclock{color:var(--ink)}

.menu{position:fixed;top:calc(var(--menubar-h) + 4px);left:8px;min-width:210px;padding:6px;border-radius:12px;background:rgba(22,26,46,.92);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 24px 50px -14px rgba(0,0,0,.6);z-index:90;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top left;transition:opacity .18s,transform .2s var(--ease),visibility .18s}
.menu.on{opacity:1;visibility:visible;transform:none}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;transition:background .15s}
.menu button:hover{background:rgba(255,255,255,.12)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
.loginrow{display:flex;align-items:center;gap:6px;padding:6px 6px 2px}
.loginrow #gBtnBox{flex:1;min-width:0}
.helpbtn{width:22px;height:22px;flex:none;border-radius:50%;background:rgba(255,255,255,.1);font-size:12px;font-weight:700;color:var(--mute);transition:background .2s}
.helpbtn:hover{background:rgba(255,255,255,.2);color:var(--ink)}
.helppop{position:absolute;top:calc(var(--menubar-h) + 4px);left:8px;width:260px;padding:14px 16px;border-radius:12px;background:rgba(22,26,46,.96);border:1px solid var(--line);box-shadow:0 24px 50px -14px rgba(0,0,0,.6);font-size:12.5px;line-height:1.5;color:#dfe2f4;z-index:95;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .2s var(--ease),visibility .2s}
.helppop.on{opacity:1;visibility:visible;transform:none}
.userrow{padding:8px 10px;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.userrow img{width:22px;height:22px;border-radius:50%}

.desktop{position:fixed;left:0;right:0;top:var(--menubar-h);bottom:var(--dock-h);z-index:1}
.icons{position:absolute;inset:0}
.icon{position:absolute;width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;transition:background .2s;touch-action:none}
.icon:hover{background:rgba(255,255,255,.08)}
.icon.drag{background:rgba(255,255,255,.14);z-index:30;transition:none}
.icon.snap{transition:left .28s var(--ease),top .28s var(--ease)}
.icon.selected{background:rgba(143,162,255,.22);box-shadow:inset 0 0 0 1px rgba(143,162,255,.6)}
.selbox{position:fixed;border:1px solid rgba(143,162,255,.85);background:rgba(143,162,255,.14);z-index:25;pointer-events:none}
.icon .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:21px;font-weight:700;color:#fff;box-shadow:0 10px 22px -8px rgba(0,0,0,.55);transition:transform .3s var(--ease);background-size:cover;background-position:center;position:relative;overflow:hidden}
.icon:hover .ic{transform:translateY(-3px) scale(1.05)}
.icon .ic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.icon .lb{font-size:11.5px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon .lb input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--accent);border-radius:4px;text-align:center;font-size:11px;color:#fff;padding:1px 2px}

/* context menu (reuse .menu look) */
.ctx{position:fixed;min-width:170px;padding:6px;border-radius:12px;background:rgba(22,26,46,.95);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 24px 50px -14px rgba(0,0,0,.6);z-index:200;opacity:0;visibility:hidden;transform:scale(.95);transform-origin:top left;transition:opacity .15s,transform .18s var(--ease),visibility .15s}
.ctx.on{opacity:1;visibility:visible;transform:none}
.ctx button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;transition:background .15s}
.ctx button:hover{background:rgba(255,255,255,.12)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:5px 2px}

/* modal / about panel */
.modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(4,6,14,.5);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.modal.on{opacity:1;visibility:visible}
.panel{width:min(360px,88vw);padding:22px 24px;border-radius:18px;background:rgba(20,24,44,.92);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.6);transform:translateY(14px) scale(.96);transition:transform .3s var(--ease)}
.modal.on .panel{transform:none}
.panel h2{margin:0 0 14px;font-size:16px}
.panel .clk{font-size:30px;font-weight:700;letter-spacing:-.02em}
.panel .dt{color:var(--mute);font-size:12.5px;margin-top:2px}
.panel hr{border:0;border-top:1px solid var(--line);margin:13px 0}
.panel .sp{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#c7cbe4}
.panel .sp b{color:var(--mute);font-weight:500}
.panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:13px;color:#dfe2f4}
.panel label small{display:block;color:var(--mute);font-size:11px;font-weight:400;margin-top:2px}
.panel select,.panel input[type=range]{accent-color:var(--accent)}
.panel select{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.sw{position:relative;width:38px;height:22px;flex:none;border-radius:11px;background:rgba(255,255,255,.18);transition:background .25s}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw.on{background:var(--accent)}.sw.on i{transform:translateX(16px)}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.pill{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.08);font-size:12.5px;transition:background .2s,transform .2s var(--ease)}
.pill:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}.pill:active{transform:scale(.95)}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#0a0d1c;font-weight:600}
.panel .fld{margin-bottom:12px}
.panel .fld span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.panel .fld input[type=text]{width:100%;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.28);outline:none}
.panel .fld input[type=text]:focus{border-color:var(--accent)}

/* windows */
.win{position:absolute;min-width:260px;min-height:180px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#12152a;border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 90px -20px rgba(0,0,0,.75);transform-origin:var(--ox,50%) var(--oy,50%)}
.win.opening{animation:winOpen .5s var(--ease) both}
.win.closing{animation:winClose .3s var(--ease) forwards}
.win.minimizing{animation:winMin .4s cubic-bezier(.5,0,.8,.4) forwards}
.win.restoring{animation:winRestore .42s var(--ease) both}
@keyframes winOpen{from{opacity:0;transform:scale(.4) translateY(40px)}to{opacity:1;transform:none}}
@keyframes winClose{to{opacity:0;transform:scale(.5) translateY(30px)}}
@keyframes winMin{to{opacity:0;transform:translate(var(--tx,0px),var(--ty,0px)) scale(.1)}}
@keyframes winRestore{from{opacity:0;transform:translate(var(--tx,0px),var(--ty,0px)) scale(.1)}to{opacity:1;transform:none}}
.win.max{border-radius:0;position:fixed!important;top:var(--menubar-h)!important;left:0!important;width:100%!important;height:calc(100% - var(--menubar-h) - var(--dock-h))!important;z-index:999!important}
.titlebar{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:#1a1e38;flex:none;cursor:grab}
.titlebar:active{cursor:grabbing}
.traffic{display:flex;gap:8px}
.tl{width:13px;height:13px;border-radius:50%;position:relative;transition:transform .15s}
.tl:hover{transform:scale(1.18)}
.tl.red{background:#ff5f57}.tl.yellow{background:#febc2e}.tl.green{background:#28c840}
.tl span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(0,0,0,.55);opacity:0;font-weight:700}
.tl:hover span{opacity:1}
.wtitle{flex:1;text-align:center;font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.wbody{flex:1;position:relative;background:#0c0e1d;overflow:auto}
.wbody iframe{width:100%;height:100%;border:0;background:#fff}
.resize{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;opacity:.4}
.resize:hover{opacity:.9}
.resize svg{width:100%;height:100%;stroke:var(--mute);fill:none;stroke-width:1.6}

.btool{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#161a33;flex:none}
.ib{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;transition:background .2s,opacity .2s,transform .2s var(--ease)}
.ib:hover:not(:disabled){background:rgba(255,255,255,.13)}.ib:active:not(:disabled){transform:scale(.85)}.ib:disabled{opacity:.28}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#relSpinTmp{display:none}
.br.spin svg{animation:spin .55s var(--ease)}@keyframes spin{to{transform:rotate(360deg)}}
.omni{flex:1;min-width:0;display:flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.omni:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(143,162,255,.14)}
.omni input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13px}.omni input::placeholder{color:var(--mute)}
.prog{height:2px;flex:none}.prog i{display:block;height:100%;width:0;opacity:0;background:linear-gradient(90deg,#8fa2ff,#7df9ff)}
.ntp{height:100%;display:grid;place-items:center;padding:16px;overflow:auto}
.openext{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:14px;background:rgba(16,19,36,.85);border:1px solid var(--line);font-size:11.5px;color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,transform .2s var(--ease)}
.openext:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.ntp h2{margin:0 0 18px;font-size:clamp(22px,4vw,34px);font-weight:700;letter-spacing:-.03em;text-align:center}
.big{height:40px;width:min(420px,80vw);margin:0 auto;display:flex;align-items:center;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:border-color .2s,transform .3s var(--ease)}
.big:focus-within{border-color:var(--accent);transform:scale(1.02)}
.big input{flex:1;border:0;background:none;outline:none;font-size:14px}
.rs{max-width:600px;margin:18px auto 0;padding:0 4px}
.rcard{display:block;padding:12px 15px;margin-bottom:9px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);text-decoration:none;color:inherit;transition:transform .25s var(--ease),background .2s;animation:rise .45s var(--ease) both}
.rcard:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rcard .ru{font-size:11px;color:var(--mute)}.rcard .rt{margin:2px 0;font-size:14.5px;font-weight:600;color:#a9b8ff}.rcard .rp{font-size:12.5px;color:#c3c8e0}
.rnote{padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);max-width:520px;margin:18px auto 0}
.rnote h3{margin:0 0 6px;font-size:14.5px}.rnote p{color:#c3c8e0;font-size:13px}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--accent);animation:bl .9s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.14s}.dots i:nth-child(3){animation-delay:.28s}
@keyframes bl{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:none}}

.dock{position:fixed;left:0;right:0;bottom:0;height:var(--dock-h);z-index:400;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px;background:rgba(16,19,36,.55);backdrop-filter:blur(22px);border-top:1px solid var(--line);animation:dockIn .6s var(--ease) both .1s;transition:transform .16s cubic-bezier(.4,0,1,1),opacity .16s}
.dock.hide{transform:translateX(120%);opacity:0;pointer-events:none}
.dock.transparent{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-top-color:transparent}
@keyframes dockIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
.dicon{position:relative;width:var(--dock-size);height:var(--dock-size);border-radius:15px;display:grid;place-items:center;font-size:21px;font-weight:700;color:#fff;transition:transform .28s var(--ease),width .25s,height .25s;box-shadow:0 10px 20px -8px rgba(0,0,0,.5);background-size:cover;background-position:center}
.dicon:hover{transform:translateY(-12px) scale(1.14)}
.dicon:active{transform:translateY(-4px) scale(1.02)}
.dicon::after{content:"";position:absolute;bottom:-9px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;transform:translateX(-50%) scale(0);transition:transform .25s var(--ease),opacity .25s}
.dicon.run::after{opacity:1;transform:translateX(-50%) scale(1)}
.dsep{width:1px;height:38px;background:var(--line);flex:none}
.widget.instance{right:auto;width:184px;max-height:none;overflow:hidden;scrollbar-width:none}
.widget.instance::-webkit-scrollbar{display:none}
.widget.instance.snap{transition:left .28s var(--ease),top .28s var(--ease)}
.loginGate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#141a3a,#05070f 70%);opacity:1;visibility:visible;transition:opacity .35s,visibility .35s}
.loginGate.off{opacity:0;visibility:hidden;pointer-events:none}
.loginGate .box{width:min(360px,88vw);padding:30px 28px;border-radius:20px;background:rgba(18,22,40,.6);border:1px solid var(--line);backdrop-filter:blur(18px);text-align:center;animation:floatIn .6s var(--ease) both}
.loginGate h1{margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.loginGate p{margin:0 0 22px;font-size:12.5px;color:var(--mute);line-height:1.6}
.loginGate .gRow{display:flex;align-items:center;justify-content:center;gap:8px}
.wihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--mute);cursor:grab}
.wihead:active{cursor:grabbing}
.wiclose{width:18px;height:18px;flex:none;border-radius:50%;font-size:13px;line-height:1;transition:background .15s}
.wiclose:hover{background:rgba(255,255,255,.18)}
.wsearch{display:flex;gap:6px}
.wsearch input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;outline:none}
.wnote textarea{width:100%;height:88px;resize:none;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:8px;outline:none;color:inherit;font:inherit;font-size:12px}
.wcal{font-size:11px}
.wcal .mon{font-weight:600;margin-bottom:8px;font-size:12.5px}
.wcal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wcal .dow{color:var(--mute)}
.wcal .today{background:var(--accent);color:#0a0d1c;font-weight:700;border-radius:6px}
.wlist{padding:16px;overflow:auto;height:100%}
.wlist h2{margin:0 0 14px;font-size:16px}
.chatwrap{display:flex;flex-direction:column;height:100%}
.poprooms{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;font-size:11px}
.poprooms .lbl{color:var(--mute);flex:none}
.poproom{flex:none;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);cursor:pointer;white-space:nowrap;transition:background .2s}
.poproom:hover{background:rgba(255,255,255,.16)}
.poproom b{color:var(--accent);margin-right:4px}
.online{flex:none;font-size:10.5px;color:#7de3a8;background:rgba(40,200,120,.14);border:1px solid rgba(40,200,120,.3);padding:3px 9px;border-radius:10px;white-space:nowrap}
.chathead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--mute);flex:none}
.chathead input{height:26px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);outline:none;color:inherit;font-size:12px;width:92px}
.chatmsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.crow{display:flex;gap:8px;align-items:flex-start;max-width:86%;animation:rise .3s var(--ease) both}
.crow.me{align-self:flex-end;flex-direction:row-reverse}
.cav{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.ccol{display:flex;flex-direction:column;gap:4px;min-width:0}
.crow.me .ccol{align-items:flex-end}
.cmsg{position:relative;max-width:100%;padding:8px 13px;border-radius:16px;background:rgba(255,255,255,.09);font-size:13px;cursor:pointer;word-break:break-word}
.crow.me .cmsg{background:var(--accent);color:#0a0d1c}
.cmsg b{display:block;font-size:10px;color:var(--mute);margin-bottom:2px;font-weight:600}
.crow.me .cmsg b{color:rgba(10,13,28,.6)}
.cchips{display:flex;gap:4px;flex-wrap:wrap}
.cchip{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid var(--line);cursor:pointer;transition:background .15s}
.cchip:hover{background:rgba(255,255,255,.2)}

.cpick span:hover{transform:scale(1.3)}

.emojibar span:hover{transform:scale(1.25)}

.chatnote{padding:4px 10px 10px;font-size:10.5px;color:var(--mute);flex:none}

function makeWidgetDraggable(el,inst){
  var head=el.querySelector(".wihead");
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".wiclose"))return;
    var sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
    try{head.setPointerCapture(e.pointerId)}catch(err){}
    function mv(ev){el.style.left=Math.max(0,ox+ev.clientX-sx)+"px";el.style.top=Math.max(28,oy+ev.clientY-sy)+"px"}
    function up(){
      removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
      var others=deskWidgets.filter(function(d){return d.id!==inst.id&&widgetElMap[d.id]}).map(function(d){return d.id});
      var rect={x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};
      var ox=inst.x,oy=inst.y,done=false;
      if(wHit(rect,wRects(others))){
        /* dropped on one widget: swap places if both fit, otherwise go to the nearest free spot */
        var over=deskWidgets.filter(function(d){if(d.id===inst.id||!widgetElMap[d.id])return false;var e=widgetElMap[d.id];
          return rect.x<d.x+e.offsetWidth&&d.x<rect.x+rect.w&&rect.y<d.y+e.offsetHeight&&d.y<rect.y+rect.h});
        if(over.length===1){
          var o=over[0],oe=widgetElMap[o.id],rest=others.filter(function(i){return i!==o.id}),rr=wRects(rest);
          var A={x:o.x,y:o.y,w:rect.w,h:rect.h},B={x:ox,y:Math.max(36,oy),w:oe.offsetWidth,h:oe.offsetHeight};
          if(!wHit(A,rr)&&!wHit(B,rr)&&!wHit(A,[B])){wMove(o,B.x,B.y);rect.x=A.x;rect.y=A.y;done=true}
        }
        if(!done){var p=wFindSpot(rect.w,rect.h,rect.x,rect.y,others);if(p){rect.x=p.x;rect.y=p.y}else{rect.x=ox;rect.y=oy}}
      }
      inst.x=rect.x;inst.y=rect.y;
      el.classList.add("snap");el.style.left=rect.x+"px";el.style.top=Math.max(28,rect.y)+"px";
      save("dbcr-widgets",deskWidgets);
      el.addEventListener("transitionend",function f(){el.classList.remove("snap");el.removeEventListener("transitionend",f)});
    }
    addEventListener("pointermove",mv);addEventListener("pointerup",up);
  });
  w.el.addEventListener("pointerdown",function(){focus(w)});
  var rs=w.el.querySelector(".resize");
  rs.addEventListener("pointerdown",function(e){
    e.stopPropagation();var sx=e.clientX,sy=e.clientY,ow=w.el.offsetWidth,oh=w.el.offsetHeight;
    function mv(ev){w.el.style.width=Math.max(300,ow+ev.clientX-sx)+"px";w.el.style.height=Math.max(200,oh+ev.clientY-sy)+"px"}
    function up(){removeEventListener("pointermove",mv);removeEventListener("pointerup",up)}
    addEventListener("pointermove",mv);addEventListener("pointerup",up);
  });
  tb.addEventListener("dblclick",function(e){if(!e.target.closest(".tl"))toggleMax(w)});
}

  for(var x=8;x<=maxX;x+=12){for(var y=36;y<=maxY;y+=12){
    var d=(x-px)*(x-px)+(y-py)*(y-py);if(d>=bd)continue;
    if(!wHit({x:x,y:y,w:w,h:h},rects)){bd=d;best={x:x,y:y}}}}
  return best}
function wMove(inst,x,y){var el=widgetElMap[inst.id];inst.x=x;inst.y=y;if(!el)return;
  el.classList.add("swap");el.style.left=x+"px";el.style.top=Math.max(28,y)+"px";
  setTimeout(function(){el.classList.remove("swap")},320)}
function placeWidget(inst,consider){
  var el=widgetElMap[inst.id];if(!el)return;
  var r={x:inst.x,y:Math.max(36,inst.y),w:el.offsetWidth,h:el.offsetHeight};
  if(!wHit(r,wRects(consider)))return;
  var p=wFindSpot(r.w,r.h,r.x,r.y,consider);if(p)wMove(inst,p.x,p.y)}
function settleWidgets(){var done=[];deskWidgets.forEach(function(inst){placeWidget(inst,done.slice());done.push(inst.id)});save("dbcr-widgets",deskWidgets)}
function addWidget(typeId){
  var type=WIDGET_TYPES.find(function(t){return t.id===typeId});if(!type)return;
  var inst={id:"w"+Date.now()+Math.floor(Math.random()*999),type:typeId,x:WPAD_X,y:WPAD_Y};
  var others=deskWidgets.map(function(d){return d.id});
  deskWidgets.push(inst);renderWidgetInstance(inst);placeWidget(inst,others);save("dbcr-widgets",deskWidgets);
}
function renderWidgetInstance(inst){
  var type=WIDGET_TYPES.find(function(t){return t.id===inst.type});if(!type)return;
  var el=document.createElement("div");el.className="widget instance on";
  el.style.left=inst.x+"px";el.style.top=Math.max(28,inst.y)+"px";
  el.innerHTML='<div class="wihead"><span></span><button class="wiclose">&times;</button></div><div class="wicontent"></div>';
  el.querySelector(".wihead span").textContent=type.t;
  el.querySelector(".wiclose").onclick=function(){
    el.remove();deskWidgets=deskWidgets.filter(function(x){return x.id!==inst.id});save("dbcr-widgets",deskWidgets);
    delete widgetElMap[inst.id];delete widgetUpdaterMap[inst.id];
  };
  document.body.appendChild(el);
  widgetElMap[inst.id]=el;
  var upd=type.build(el.querySelector(".wicontent"),inst);
  if(upd)widgetUpdaterMap[inst.id]=upd;
  makeWidgetDraggable(el,inst);
}
function removeAllWidgets(){
  Object.keys(widgetElMap).forEach(function(id){widgetElMap[id].remove()});
  widgetElMap={};widgetUpdaterMap={};deskWidgets=[];save("dbcr-widgets",deskWidgets);
}
function makeWidgetDraggable(el,inst){
  var head=el.querySelector(".wihead");
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".wiclose"))return;
    var sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
    try{head.setPointerCapture(e.pointerId)}catch(err){}
    function mv(ev){el.style.left=Math.max(0,ox+ev.clientX-sx)+"px";el.style.top=Math.max(28,oy+ev.clientY-sy)+"px"}
    function up(){
      removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
      var cc=wCellOf(el.offsetLeft,el.offsetTop),other=deskWidgets.find(function(d){if(d.id===inst.id)return false;var oc=wCellOf(d.x,d.y);return oc.c===cc.c&&oc.r===cc.r}),free,np;
      if(other&&widgetElMap[other.id]){
        var oel=widgetElMap[other.id];other.x=inst.x;other.y=inst.y;
        oel.classList.add("swap");oel.style.left=other.x+"px";oel.style.top=Math.max(28,other.y)+"px";
        setTimeout(function(){oel.classList.remove("swap")},320);
        np=wCellPos(cc.c,cc.r);
      }else{free=wNearestFree(cc.c,cc.r,inst.id);np=wCellPos(free.c,free.r)}
      el.classList.add("snap");el.style.left=np.x+"px";el.style.top=np.y+"px";
      inst.x=np.x;inst.y=np.y;save("dbcr-widgets",deskWidgets);
      el.addEventListener("transitionend",function f(){el.classList.remove("snap");el.removeEventListener("transitionend",f)});
    }
    addEventListener("pointermove",mv);addEventListener("pointerup",up);
  });
}

var COUNTRY_PREFIX={"South Korea":"korea","North Korea":"korea","United States":"usa","United Kingdom":"uk","Japan":"japan","China":"china","Canada":"canada","Australia":"australia","Germany":"germany","France":"france","India":"india","Brazil":"brazil","Mexico":"mexico","Spain":"spain","Italy":"italy","Russia":"russia","Vietnam":"vietnam","Thailand":"thailand","Indonesia":"indonesia","Philippines":"philippines"};
function guessCountryPrefix(cb){
  fetchT("https://ipapi.co/json/",2500).then(function(tx){
    var d=JSON.parse(tx),name=d.country_name||"";
    var pre=COUNTRY_PREFIX[name]||(name?name.toLowerCase().replace(/[^a-z]/g,""):"");
    cb(pre||"room");
  }).catch(function(){cb("room")});
}

/* ---------- mini browser ---------- */
function fetchT(url,ms){var c=new AbortController(),to=setTimeout(function(){c.abort()},ms);
  return fetch(url,{signal:c.signal}).then(function(r){clearTimeout(to);if(!r.ok)throw 0;return r.text()})}
function wiki(q){var lang=/[가-힣]/.test(q)?"ko":"en";
  return fetchT("https://"+lang+".wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(q)+"&format=json&origin=*&srlimit=10",5000).then(function(tx){
    var r=JSON.parse(tx).query.search;if(!r.length)throw 0;
    return r.map(function(x){return {t:x.title,u:"https://"+lang+".wikipedia.org/wiki/"+encodeURIComponent(x.title.replace(/ /g,"_")),s:new DOMParser().parseFromString(x.snippet,"text/html").body.textContent}})})}
var PROXIES=[function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u)},function(u){return "https://corsproxy.io/?"+encodeURIComponent(u)}];
function ddgProxy(q){var u="https://html.duckduckgo.com/html/?q="+encodeURIComponent(q),i=0;
  function next(){if(i>=PROXIES.length)return Promise.reject(0);
    return fetchT(PROXIES[i++](u),5000).then(function(tx){
      var doc=new DOMParser().parseFromString(tx,"text/html"),out=[];
      doc.querySelectorAll(".result").forEach(function(r){var a=r.querySelector(".result__a");if(!a||r.classList.contains("result--ad"))return;
        var href=a.getAttribute("href")||"",m=href.match(/uddg=([^&]+)/);
        if(m)href=decodeURIComponent(m[1]);else if(href.indexOf("//")===0)href="https:"+href;
        if(!/^https?:/.test(href))return;var sn=r.querySelector(".result__snippet");
        out.push({t:a.textContent.trim(),u:href,s:sn?sn.textContent.trim():""})});
      if(!out.length)throw 0;return out}).catch(next)}
  return next()}
function viaProxy(u,parse){var i=0;
  function next(){if(i>=PROXIES.length)return Promise.reject(0);
    return fetchT(PROXIES[i++](u),6000).then(function(tx){var out=parse(new DOMParser().parseFromString(tx,"text/html"));if(!out.length)throw 0;return out}).catch(next)}
  return next()}
function braveProxy(q){return viaProxy("https://search.brave.com/search?q="+encodeURIComponent(q)+"&source=web",function(doc){var out=[];
  doc.querySelectorAll('.snippet[data-type="web"], #results .snippet').forEach(function(r){
    var a=r.querySelector('a[href^="http"]');if(!a)return;
    var ti=r.querySelector(".title,.snippet-title"),ds=r.querySelector(".snippet-description,.content,.description");
    out.push({t:(ti||a).textContent.trim().replace(/\s+/g," "),u:a.getAttribute("href"),s:ds?ds.textContent.trim():""})});
  return out})}
function viaServer(q,engine){return fetchT("/.netlify/functions/search?engine="+engine+"&q="+encodeURIComponent(q),8000).then(function(tx){var l=JSON.parse(tx);if(!l.length)throw 0;return l})}
function brave(q){return viaServer(q,"brave").catch(function(){return braveProxy(q)})}
function ddg(q){return viaServer(q,"ddg").catch(function(){return ddgProxy(q)})}
var ENGINE_NAMES={brave:"Brave",ddg:"DuckDuckGo",wiki:"Wikipedia"};
if(!ENGINE_NAMES[SETTINGS.engine])SETTINGS.engine="brave";
var NO_EMBED=/(^|\.)(google\.[a-z.]+|youtube\.com|youtu\.be|brave\.com|duckduckgo\.com|naver\.com|daum\.net|kakao\.com|facebook\.com|instagram\.com|twitter\.com|x\.com|github\.com|linkedin\.com|netflix\.com|reddit\.com|amazon\.[a-z.]+|coupang\.com|openai\.com|chatgpt\.com|claude\.ai|tiktok\.com|discord\.com)$/i;
function noEmbed(u){try{return NO_EMBED.test(new URL(u).hostname)}catch(e){return false}}
function norm(v){if(/^https?:\/\//i.test(v))return v;if(/^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(v))return "https://"+v;return null}

function buildBrowser(w){
  w.body.innerHTML=
    '<div class="btool">'+
      '<button class="ib bh"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>'+
      '<button class="ib bb" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>'+
      '<button class="ib bf" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>'+
      '<button class="ib br"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>'+
      '<form class="omni"><input class="ba" placeholder="'+t("searchPlaceholder")+'"></form>'+
      '<select class="eng" title="Search engine"><option value="brave">Brave</option><option value="ddg">DuckDuckGo</option><option value="wiki">Wikipedia</option></select>'+
    '</div><div class="prog"><i></i></div><div class="page" style="position:relative;flex:1;min-height:0;overflow:auto"></div>';
  var page=w.body.querySelector(".page"),addr=w.body.querySelector(".ba"),prog=w.body.querySelector(".prog i"),relBtn=w.body.querySelector(".br");
  var hist=[{url:"",q:"",title:t("newTab")}],idx=0,fr=null,pt;
  function progStart(){clearTimeout(pt);prog.style.transition="none";prog.style.opacity=1;prog.style.width="0";void prog.offsetWidth;prog.style.transition="width 5s cubic-bezier(.1,.8,.2,1)";prog.style.width="85%"}
  function progEnd(){prog.style.transition="width .25s";prog.style.width="100%";pt=setTimeout(function(){prog.style.transition="opacity .35s";prog.style.opacity=0},250)}
  function showNtp(){page.innerHTML='<div class="ntp"><div><h2>DBrowser</h2><form class="big"><input class="bq" placeholder="'+t("searchPlaceholder")+'"></form></div></div>';
    page.querySelector("form").onsubmit=function(e){e.preventDefault();submit(page.querySelector(".bq").value)}}
  function card(html){page.innerHTML='<div class="rnote">'+html+'</div>'}
  function showResults(q){
    progStart();card('<div class="dots"><i></i><i></i><i></i></div>');
    function draw(list,note){var box=document.createElement("div");box.className="rs";
      if(note){var n=document.createElement("div");n.className="rnote";n.style.marginBottom="10px";n.innerHTML="<p>"+note+"</p>";box.appendChild(n)}
      var ext=document.createElement("button");ext.type="button";ext.className="pill";ext.style.marginBottom="10px";ext.textContent="Brave Search에서 열기";
      ext.onclick=function(){window.open("https://search.brave.com/search?q="+encodeURIComponent(q),"_blank","noopener")};box.appendChild(ext);
      list.forEach(function(r,i){var a=document.createElement("a");a.className="rcard";a.href=r.u;a.style.animationDelay=i*35+"ms";
        a.innerHTML='<div class="ru"></div><div class="rt"></div><div class="rp"></div>';
        a.children[0].textContent=host(r.u);a.children[1].textContent=r.t;a.children[2].textContent=r.s;
        a.onclick=function(ev){ev.preventDefault();navTo(r.u,host(r.u))};box.appendChild(a)});
      page.innerHTML="";page.appendChild(box);progEnd()}
    var fns={brave:brave,ddg:ddg,wiki:wiki},order=SETTINGS.engine==="wiki"?["wiki"]:SETTINGS.engine==="ddg"?["ddg","wiki"]:["brave","ddg","wiki"];
    function tryAt(k){var name=order[k];
      return fns[name](q).then(function(l){draw(l,k>0?ENGINE_NAMES[order[0]]+" did not respond, showing "+ENGINE_NAMES[name]+" results instead.":"")})
        .catch(function(){if(k+1<order.length)return tryAt(k+1);throw 0})}
    tryAt(0)
      .catch(function(){card('<h3>Could not load results</h3><p>앱 안에서 검색 결과를 가져오지 못했어요. 아래 버튼으로 Brave Search를 새 탭에서 열 수 있어요.</p><div class="row2"><button class="pill" id="rtB">다시 시도</button><button class="pill pri" id="rbB">Brave Search에서 열기</button></div>');
        $("#rtB",page).onclick=function(){showResults(q)};
        $("#rbB",page).onclick=function(){window.open("https://search.brave.com/search?q="+encodeURIComponent(q),"_blank","noopener")};progEnd()})}
  function render(){var h=hist[idx];addr.value=h.url||h.q;
    w.el.querySelector(".wtitle").textContent=h.title||w.app.t;
    w.body.querySelector(".bb").disabled=idx<1;w.body.querySelector(".bf").disabled=idx>=hist.length-1;
    if(h.url&&noEmbed(h.url)){
      fr=null;progEnd();
      card('<h3>'+host(h.url)+'</h3><p>이 사이트는 다른 페이지 안에서 열리지 않도록 막혀 있어요. 새 탭에서 열어주세요.</p><div class="row2"><button class="pill pri" id="neB">새 탭에서 열기</button></div>');
      $("#neB",page).onclick=function(){window.open(h.url,"_blank","noopener")};
    }
    else if(h.url){
      if(!fr){fr=document.createElement("iframe");fr.title="page";fr.setAttribute("referrerpolicy","no-referrer");fr.onload=function(){progEnd()}}
      page.innerHTML="";page.appendChild(fr);
      var ext=document.createElement("button");ext.type="button";ext.className="openext";ext.innerHTML="⧉ 이 사이트가 안 보이면 새 탭에서 열기";
      ext.onclick=function(){window.open(h.url,"_blank","noopener")};page.appendChild(ext);
      progStart();fr.src=h.url;
    }
    else if(h.q) showResults(h.q);
    else { fr=null; showNtp(); }}
  function pushHist(e){hist=hist.slice(0,idx+1);hist.push(e);idx++;render()}
  function navTo(url,title){pushHist({url:url,q:"",title:title})}
  function submit(v){v=(v||"").trim();if(!v)return;var u=norm(v);if(u)navTo(u,host(u));else pushHist({url:"",q:v,title:v})}
  w.body.querySelector(".bh").onclick=function(){pushHist({url:"",q:"",title:t("newTab")})};
  w.body.querySelector(".bb").onclick=function(){if(idx>0){idx--;render()}};
  w.body.querySelector(".bf").onclick=function(){if(idx<hist.length-1){idx++;render()}};
  relBtn.onclick=function(){relBtn.classList.remove("spin");void relBtn.offsetWidth;relBtn.classList.add("spin");
    var h=hist[idx];if(h.url){render()}else if(h.q)showResults(h.q)};
  w.body.querySelector(".omni").onsubmit=function(e){e.preventDefault();submit(addr.value);addr.blur()};
  var engSel=w.body.querySelector(".eng");engSel.value=SETTINGS.engine;
  engSel.onchange=function(){SETTINGS.engine=engSel.value;persistSettings();var h=hist[idx];if(h.q&&!h.url)showResults(h.q)};
  w.submitQuery=submit;
  render();
}

/* ---------- menu bar clock ---------- */
function two(n){return (n<10?"0":"")+n}
function clockStr(){var d=new Date();return two(d.getHours())+":"+two(d.getMinutes())+(SETTINGS.seconds?":"+two(d.getSeconds()):"")}
function dateStr(){return new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function tick(){$("#mbClock").textContent=clockStr();$("#pClk").textContent=two(new Date().getHours())+":"+two(new Date().getMinutes());$("#pDt").textContent=dateStr();$("#wClk").textContent=two(new Date().getHours())+":"+two(new Date().getMinutes());$("#wDt").textContent=dateStr()}
tick();setInterval(tick,1000);
deskWidgets.forEach(renderWidgetInstance);
settleWidgets();
setInterval(function(){Object.keys(widgetUpdaterMap).forEach(function(id){widgetUpdaterMap[id]()})},1000);

/* ---------- background stars: gentle by default, tunable ---------- */
var cv=$("#sky"),cx=cv.getContext("2d"),W,H,dpr,S=[];
var m={x:innerWidth/2,y:innerHeight/2},sm={x:m.x,y:m.y};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.round(Math.min(90,W*H/13000)),keep=S;S=[];
  for(var i=0;i<n;i++){
    var old=keep[i];
    if(old){S.push(old);continue}
    var x=Math.random()*W,y=Math.random()*H,ang=-2.35+(Math.random()-.5)*.35,spd=.06+Math.random()*.1;
    S.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,z:.4+Math.random()*.8,ph:Math.random()*6.28});
  }}
resize();addEventListener("resize",resize);
addEventListener("pointermove",function(e){m.x=e.clientX;m.y=e.clientY});
var INTENSITY={subtle:{R:110,pull:10,lineMax:.3,linkMax:.14},normal:{R:170,pull:16,lineMax:.42,linkMax:.2},strong:{R:230,pull:24,lineMax:.55,linkMax:.26}};
var T=0;
function frame(){
  T+=.008;sm.x+=(m.x-sm.x)*.22;sm.y+=(m.y-sm.y)*.22;cx.clearRect(0,0,W,H);
  var cfg=INTENSITY[SETTINGS.intensity]||INTENSITY.normal,R=SETTINGS.track?cfg.R:0,reduce=SETTINGS.reduceMotion,drift=(reduce?.08:1)*(SETTINGS.speed==null?1:SETTINGS.speed);
  var draw=[];
  for(var i=0;i<S.length;i++){
    var s=S[i];
    /* continuous drift: stars always move, independent of the mouse */
    s.x+=s.vx*drift;s.y+=s.vy*drift;
    if(s.x<-10)s.x=W+10;if(s.x>W+10)s.x=-10;if(s.y<-10)s.y=H+10;if(s.y>H+10)s.y=-10;
    var wob=Math.sin(T+s.ph)*1.2,wob2=Math.cos(T*.8+s.ph)*1.2;
    var dx=s.x+wob,dy=s.y+wob2,dpull=0;
    if(SETTINGS.track&&!reduce){var d=Math.hypot(dx-sm.x,dy-sm.y),p=Math.max(0,1-d/R);p=p*p*cfg.pull;
      dx+=(sm.x-dx)*0.01*p*16;dy+=(sm.y-dy)*0.01*p*16;}
    draw.push({x:dx,y:dy,z:s.z});
  }
  for(var a=0;a<draw.length;a++){var A=draw[a];
    if(SETTINGS.track){var ad=Math.hypot(A.x-sm.x,A.y-sm.y);
      if(ad<R){cx.strokeStyle="rgba(150,185,255,"+(1-ad/R)*cfg.lineMax+")";cx.lineWidth=.8;cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(sm.x,sm.y);cx.stroke()}}
    for(var c=a+1;c<draw.length;c++){var B=draw[c],bd=Math.hypot(A.x-B.x,A.y-B.y);
      if(bd<105){cx.strokeStyle="rgba(170,190,255,"+(1-bd/105)*cfg.linkMax+")";cx.lineWidth=.6;cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.stroke()}}}
  for(var j=0;j<draw.length;j++){var t=draw[j];cx.fillStyle="rgba(235,240,255,"+(.3+t.z*.4)+")";cx.beginPath();cx.arc(t.x,t.y,.6+t.z*1.1,0,6.283);cx.fill()}
  requestAnimationFrame(frame)}
frame();
})();
</script>
